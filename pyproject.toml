[project]
name = "office_docs_mcp"
version = "0.1.1"
description = "Model Context Protocol (MCP) server for reading and writing Office documents (Excel, Word, PowerPoint)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Team" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "office",
    "excel",
    "word",
    "powerpoint",
    "openpyxl",
    "python-docx",
    "python-pptx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "wpyconf",
    "wpylog",
    "wpycli",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "mcp>=2.2.0",
]

[project.scripts]
office-docs-mcp = "office_docs_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "UP"]

[dependency-groups]
dev = ["ruff", "pytest"]
