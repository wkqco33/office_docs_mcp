[project]
name = "office_docs_mcp"
version = "0.1.0"
description = "wpycli 기반 CLI 프로젝트 템플릿"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wpyconf",
    "wpylog",
    "wpycli",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "mcp>=2.2.0",
]

[project.scripts]
office-docs-mcp = "office_docs_mcp.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = ["ruff", "pytest"]
