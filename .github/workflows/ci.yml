name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked --group dev
          else
            uv sync --group dev
          fi

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
